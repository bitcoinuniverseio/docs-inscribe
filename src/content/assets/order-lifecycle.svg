<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-labelledby="t d">
  <title id="t">The life of a commit-address order</title>
  <desc id="d">Four steps: you review the full cost, you pay the commit address once, Universe detects the payment and broadcasts the reveal, then the reveal confirms. Closing the tab after step two does not lose the order; Activity resumes it. An order with no payment inside one hour expires.</desc>

  <rect x="0" y="0" width="880" height="470" rx="18" fill="#12101a"/>
  <rect x="0.5" y="0.5" width="879" height="469" rx="18" fill="none" stroke="#3a2f45"/>

  <text x="40" y="52" font-family="ui-sans-serif,Segoe UI,Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#f4f0f6">The life of a commit-address order</text>
  <text x="40" y="78" font-family="ui-sans-serif,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#b7aec2">Most protocol mints and inscriptions follow this path. You act in steps 1 and 2 only.</text>

  <!-- track -->
  <line x1="98" y1="168" x2="782" y2="168" stroke="#3f3550" stroke-width="2"/>

  <!-- step 1 -->
  <circle cx="98" cy="168" r="18" fill="#ff5c9c"/>
  <text x="98" y="174" text-anchor="middle" font-family="ui-sans-serif,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#12101a">1</text>
  <text x="98" y="216" text-anchor="middle" font-family="ui-sans-serif,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#f4f0f6">You see the cost</text>
  <text x="98" y="238" text-anchor="middle" font-family="ui-sans-serif,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#a79db3">Network fee, service</text>
  <text x="98" y="255" text-anchor="middle" font-family="ui-sans-serif,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#a79db3">fee, and the total</text>

  <!-- step 2 -->
  <circle cx="326" cy="168" r="18" fill="#ff5c9c"/>
  <text x="326" y="174" text-anchor="middle" font-family="ui-sans-serif,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#12101a">2</text>
  <text x="326" y="216" text-anchor="middle" font-family="ui-sans-serif,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#f4f0f6">You pay, once</text>
  <text x="326" y="238" text-anchor="middle" font-family="ui-sans-serif,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#a79db3">Send the exact amount</text>
  <text x="326" y="255" text-anchor="middle" font-family="ui-sans-serif,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#a79db3">to the commit address</text>

  <!-- step 3 -->
  <circle cx="554" cy="168" r="18" fill="#12101a" stroke="#7b6d8a" stroke-width="2"/>
  <text x="554" y="174" text-anchor="middle" font-family="ui-sans-serif,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#d7d1de">3</text>
  <text x="554" y="216" text-anchor="middle" font-family="ui-sans-serif,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#f4f0f6">Universe reveals</text>
  <text x="554" y="238" text-anchor="middle" font-family="ui-sans-serif,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#a79db3">Payment detected, the</text>
  <text x="554" y="255" text-anchor="middle" font-family="ui-sans-serif,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#a79db3">reveal is broadcast</text>

  <!-- step 4 -->
  <circle cx="782" cy="168" r="18" fill="#12101a" stroke="#5eb8a0" stroke-width="2"/>
  <text x="782" y="174" text-anchor="middle" font-family="ui-sans-serif,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#5eb8a0">4</text>
  <text x="782" y="216" text-anchor="middle" font-family="ui-sans-serif,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#f4f0f6">Confirmed</text>
  <text x="782" y="238" text-anchor="middle" font-family="ui-sans-serif,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#a79db3">It lands in your</text>
  <text x="782" y="255" text-anchor="middle" font-family="ui-sans-serif,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#a79db3">Ordinals address</text>

  <text x="212" y="150" text-anchor="middle" font-family="ui-sans-serif,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" letter-spacing="1.2" fill="#8a7f97">YOU</text>
  <text x="668" y="150" text-anchor="middle" font-family="ui-sans-serif,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" letter-spacing="1.2" fill="#8a7f97">AUTOMATIC</text>

  <!-- resume -->
  <rect x="40" y="300" width="404" height="130" rx="14" fill="#181425" stroke="#3f3550"/>
  <text x="64" y="332" font-family="ui-sans-serif,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#f4f0f6">Closing the tab does not lose it</text>
  <text x="64" y="358" font-family="ui-sans-serif,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#c8c1d2">This browser keeps the order id, the workflow,</text>
  <text x="64" y="378" font-family="ui-sans-serif,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#c8c1d2">and when it was recorded. Nothing else.</text>
  <text x="64" y="404" font-family="ui-sans-serif,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#c8c1d2">Home and Activity offer it back to you.</text>

  <!-- expiry -->
  <rect x="468" y="300" width="372" height="130" rx="14" fill="#181425" stroke="#3f3550"/>
  <text x="492" y="332" font-family="ui-sans-serif,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#f4f0f6">One hour to pay</text>
  <text x="492" y="358" font-family="ui-sans-serif,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#c8c1d2">A commit-address order with no payment</text>
  <text x="492" y="378" font-family="ui-sans-serif,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#c8c1d2">inside one hour expires.</text>
  <text x="492" y="404" font-family="ui-sans-serif,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#c8c1d2">Pay the exact amount shown, once.</text>
</svg>
