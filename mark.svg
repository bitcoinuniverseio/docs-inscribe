<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="">
  <title>Inscribe</title>
  <desc>A graver held to a bench line, with the cut it has just made picked out in amber.</desc>
  <!-- The bench: the surface the work sits on. -->
  <path d="M3 26.5h26" stroke="currentColor" stroke-width="2.4" stroke-linecap="square" opacity=".55"/>
  <!-- The graver: a tapered shank driven to a point. -->
  <path d="M20.4 2.6 27 9.2 13.6 22.6l-6.6-6.6z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M13.6 22.6 8.2 24l1.4-5.4z" fill="currentColor"/>
  <!-- The cut: the one thing on the page that is not neutral. -->
  <path d="M4.5 22.2 9.4 17.3" stroke="#ffb13d" stroke-width="3" stroke-linecap="round"/>
</svg>
