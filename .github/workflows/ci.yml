name: ci

on:
  push:
    branches: [develop, main]
  pull_request:

# This repository is public. Fork pull requests must never reach the
# organisation-owned machines.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # GitHub evaluates this condition before it assigns the job.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, linux-ultra, playwright-chromium]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: bitcoinuniverseio/universe-ci-actions/universe-node-env@8e24bc760556caa5ec8c7c497baaad2e9adcc912 # v1
      - name: Install
        run: npm ci
      - name: Copy guard (long dash, banned word, marketing phrases)
        run: npm run check:copy
      - name: Public-safety scan (private hostnames, IPs, secret shapes)
        run: npm run check:public-safety
      - name: Capability truth (registry agrees with the shipped app)
        run: npm run check:capabilities
      - name: Manifest agrees with the build
        run: npm run check:manifest
      - name: Markdown lint
        run: npm run check:markdown
      - name: Build (validates every internal link and anchor)
        run: npm run build
      - name: Search index exists
        run: test -f dist/pagefind/pagefind.js
      - name: Sitemap exists
        run: test -f dist/sitemap-index.xml
      - name: Machine-readable index exists
        run: test -s dist/llms.txt
      - name: Install a browser for the accessibility audit
        run: npx playwright install chromium
      - name: Serve the built site
        run: npx astro preview --port 4323 &
      - name: Accessibility and horizontal overflow, every page, both themes
        run: npx wait-on http://localhost:4323/docs-inscribe/ && npm run check:a11y
      - name: Secret scan (full history)
        uses: trufflesecurity/trufflehog@v3.90.5
        with:
          base: ''
          head: ''
          extra_args: --only-verified
